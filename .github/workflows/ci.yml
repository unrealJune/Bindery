name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: azure/setup-helm@v5
      - name: Build
        run: dotnet build Bindery.sln --configuration Release
      - name: Test
        run: dotnet test Bindery.sln --configuration Release --no-build
      - name: Helm lint
        run: helm lint deploy/helm/bindery
      - name: Helm template
        run: helm template bindery deploy/helm/bindery
      # Hedgerow's chapter parser and store are stdlib-only by design, so they are unit
      # tested here rather than only through the container. The parser is the piece two
      # ingest paths have to agree on; a regression there silently duplicates chapters.
      - name: Hedgerow unit tests
        run: python -m unittest discover -s tests -t . --verbose
        working-directory: plugins/hedgerow

      - name: Plugin conformance self-test
        run: python tests/conformance/run.py --self-test --no-color

      # The stub presents one UI tier per run, and the two tiers are checked for opposite
      # things — `fragment` for shipping no JavaScript, `sandboxed` for not depending on
      # egress its CSP removes. Running only one would leave half the UI checks unexercised.
      - name: Plugin conformance self-test (sandboxed UI tier)
        run: python tests/conformance/run.py --self-test --stub-ui-mode sandboxed --no-color

  # The gate that makes dependency bumps meaningful.
  #
  # `build-test` above never installs Python and never sees FanFicFare, so on its own it
  # would wave through a FanFicFare bump without evidence. This job builds the real
  # plugin image and runs the black-box suite — including the XSS vector set, which is a
  # merge gate — against the running container.
  #
  # Deliberately not path-filtered: a skipped workflow leaves a required status check
  # pending forever, so this runs on every PR and leans on the buildx cache for speed.
  plugin-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BINDERY_PLUGIN_TOKEN: conformance-ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build plugin image
        uses: docker/build-push-action@v7
        with:
          context: plugins/fanficfare
          file: plugins/fanficfare/Dockerfile
          push: false
          load: true
          tags: bindery-plugin-fanficfare:ci
          cache-from: type=gha,scope=fanficfare
          cache-to: type=gha,scope=fanficfare,mode=max

      # Started the way the chart runs it — unprivileged, read-only root, /work the only
      # writable path. If a dependency bump breaks that posture, it fails here and not in
      # a cluster.
      - name: Start plugin
        run: |
          docker run -d --name plugin \
            -p 8080:8080 \
            -e BINDERY_PLUGIN_TOKEN="$BINDERY_PLUGIN_TOKEN" \
            -e BINDERY_FFF_ALLOW_TEST_SITES=1 \
            --read-only \
            --tmpfs /tmp:rw,size=64m \
            bindery-plugin-fanficfare:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "plugin never became healthy"; exit 1

      # Confirms the pinned FanFicFare actually resolves and runs in the image, which a
      # pip-install-only check would not prove.
      - name: Verify FanFicFare is present
        run: |
          docker exec plugin fanficfare --version
          docker exec plugin python -c "import fanficfare, sys; print('fanficfare', fanficfare.__file__)"

      # FanFicFare ships adapters for four fake sites that fabricate a story with no
      # network at all, which is why BINDERY_FFF_ALLOW_TEST_SITES is set above. That makes
      # a genuine end-to-end download — queue, stream progress, produce an EPUB, extract a
      # cover — cheap and hermetic, so `download.real` runs here instead of being skipped.
      # The URL is read out of the installed FanFicFare rather than hardcoded, so a version
      # bump that changes the example format does not silently stop testing anything.
      - name: Resolve offline test-site URL
        run: |
          url=$(docker exec plugin python -c \
            "from fanficfare import adapters; print((dict(adapters.getSiteExamples()).get('test1.com') or [''])[0])" \
            | tr -d '\r')
          echo "Resolved: ${url:-<none>}"
          echo "DOWNLOAD_URL=$url" >> "$GITHUB_ENV"

      - name: Conformance suite
        run: |
          extra=""
          if [ -n "$DOWNLOAD_URL" ]; then
            extra="--download-url $DOWNLOAD_URL --download-timeout 120"
          else
            echo "::warning::no offline test adapter found; skipping the real-download check"
          fi
          python tests/conformance/run.py \
            --base-url http://localhost:8080 \
            --token "$BINDERY_PLUGIN_TOKEN" \
            --no-color $extra

      - name: Plugin logs
        if: always()
        run: docker logs plugin || true

      - name: Stop plugin
        if: always()
        run: docker rm -f plugin || true

  # The same gate for Hedgerow, which is a separate job rather than a matrix leg because
  # the two plugins are exercised differently: FanFicFare ships offline test adapters that
  # make a real end-to-end download cheap, and Hedgerow has no equivalent — its sources are
  # a live site and a Discord gateway, neither of which belongs in CI.
  #
  # What this does prove is the part that is easy to break: that the image builds with
  # FanFicFare and discord.py resolved, that the plugin starts with **no configuration at
  # all** (no bot token, no channels), and that its sandboxed UI conforms — including that
  # it never reaches for fetch/XHR, which the frame's `connect-src 'none'` would block at
  # runtime in a way no unit test would catch.
  hedgerow-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BINDERY_PLUGIN_TOKEN: conformance-ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build plugin image
        uses: docker/build-push-action@v7
        with:
          context: plugins/hedgerow
          file: plugins/hedgerow/Dockerfile
          push: false
          load: true
          tags: bindery-plugin-hedgerow:ci
          cache-from: type=gha,scope=hedgerow
          cache-to: type=gha,scope=hedgerow,mode=max

      # Unlike FanFicFare's, this plugin keeps durable state — ingested chapters, source
      # attribution, manual ordering — so /work is a real volume rather than a tmpfs of
      # scratch. A *named* volume specifically: Docker seeds one from the image's own
      # directory, so this also proves the Dockerfile chowns /work to the unprivileged user
      # it then switches to. A bare tmpfs would mount root-owned and mask that. In the chart
      # the equivalent guarantee is podSecurityContext.fsGroup.
      - name: Start plugin
        run: |
          docker volume create hedgerow-work
          docker run -d --name plugin \
            -p 8080:8080 \
            -e BINDERY_PLUGIN_TOKEN="$BINDERY_PLUGIN_TOKEN" \
            --read-only \
            --tmpfs /tmp:rw,size=64m \
            -v hedgerow-work:/work \
            bindery-plugin-hedgerow:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "plugin never became healthy"; exit 1

      # discord.py imports `audioop`, which PEP 594 removed in Python 3.13. The image pins
      # 3.12, so this is the check that catches a base-image bump breaking the bot.
      - name: Verify dependencies resolve in the image
        run: |
          docker exec plugin python -c "import fanficfare; print('fanficfare', fanficfare.__file__)"
          docker exec plugin python -c "import discord; print('discord.py', discord.__version__)"

      # Starting with no bot token must leave the plugin healthy and Royal-Road-only, never
      # crash-looping. A plugin that requires configuration to pass a liveness probe cannot
      # be deployed before it is configured.
      - name: Verify it starts unconfigured
        run: |
          curl -fsS http://localhost:8080/healthz | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Conformance suite
        run: |
          python tests/conformance/run.py \
            --base-url http://localhost:8080 \
            --token "$BINDERY_PLUGIN_TOKEN" \
            --no-color

      - name: Plugin logs
        if: always()
        run: docker logs plugin || true

      - name: Stop plugin
        if: always()
        run: |
          docker rm -f plugin || true
          docker volume rm hedgerow-work || true
