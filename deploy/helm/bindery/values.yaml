replicaCount: 1

image:
  repository: ghcr.io/OWNER/bindery
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

pluginSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: bindery.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

persistence:
  data:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 1Gi
    storageClass: ""
  library:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 20Gi
    storageClass: ""

bindery:
  catalogTitle: Bindery
  catalogSubtitle: A small self-hosted library
  publicBaseUrl: ""
  pageSize: 24
  auth:
    mode: Oidc
    authority: ""
    clientId: ""
    requireHttpsMetadata: true
    scopes: ["openid", "profile", "email"]
    allowedUsers: []
    nameClaim: name
    sessionLifetime: 14.00:00:00
  downloads:
    concurrency: 2
    maxAttempts: 3
    retryDelay: 00:00:30
    idleTimeout: 00:05:00
    maxArtifactBytes: 536870912
    historyLimit: 500
  plugins:
    tokenSecret:
      existingSecret: ""
      key: token
  oidc:
    clientSecret:
      existingSecret: ""
      key: client-secret
  security:
    # Extra origins for the CSP form-action list. `'self'` and the OIDC authority
    # (bindery.auth.authority) are always included, so most deployments leave this
    # empty. Add an origin only when a sign-in or sign-out POST redirects somewhere
    # else — browsers enforce form-action across the whole redirect chain, and an
    # origin missing here is a login that fails silently in the browser.
    formActionSources: []

plugins:
  - name: fanficfare
    enabled: true
    mode: sidecar
    image: ghcr.io/OWNER/bindery-plugin-fanficfare:0.1.0
    port: 8080
    resources:
      limits:
        memory: 512Mi
    configSecret: ""

  # Reconciles a serial from Royal Road and forwarded Discord EPUBs. Off by default: it is
  # for one specific serial, and its Discord bot needs a token and the MESSAGE_CONTENT
  # privileged intent before it does anything beyond Royal Road.
  #
  # Note the persistence block. Unlike fanficfare, whose /work is scratch for in-flight
  # artifacts, this plugin keeps ingested chapters and their source attribution in SQLite
  # under /work/data — on an emptyDir that state is thrown away on every restart, and
  # first-seen precedence quietly stops meaning anything.
  - name: hedgerow
    enabled: false
    mode: sidecar
    image: ghcr.io/OWNER/bindery-plugin-hedgerow:0.1.0
    port: 8080
    resources:
      limits:
        memory: 512Mi
    configSecret: ""
    persistence:
      enabled: true
      size: 2Gi
      accessModes:
        - ReadWriteOnce
      storageClass: ""
      existingClaim: ""

nodeSelector: {}
tolerations: []
affinity: {}
