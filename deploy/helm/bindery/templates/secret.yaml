{{- if not .Values.bindery.plugins.tokenSecret.existingSecret }}
{{- /*
  Generated once and then kept. `randAlphaNum` runs on every render, so without looking
  the existing Secret up first, every `helm upgrade` would rotate the host-to-plugin token
  and break in-flight downloads until every plugin container restarted.
  For anything you care about, set `bindery.plugins.tokenSecret.existingSecret`.
*/ -}}
{{- $name := include "bindery.pluginTokenSecretName" . }}
{{- $key := .Values.bindery.plugins.tokenSecret.key }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if and $existing (index $existing.data $key) }}
{{- $token = index $existing.data $key | b64dec }}
{{- else }}
{{- $token = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "bindery.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $key }}: {{ $token | quote }}
{{- end }}
